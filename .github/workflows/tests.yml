name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Mirrors the local pg_hba `trust` setup, so no passwords are in play.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, gmp, intl
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.3'

      # The app role is DML-only and owns nothing, so it cannot disable the row-level
      # security policies it is subject to. `postgres` stands in for the local owner role.
      - name: Provision databases
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE faturly_app LOGIN"
          for db in faturly_laravel faturly_laravel_test; do
            createdb -h 127.0.0.1 -U postgres "$db"
            psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 <<SQL
          GRANT CONNECT ON DATABASE $db TO faturly_app;
          GRANT USAGE   ON SCHEMA public TO faturly_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO faturly_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO faturly_app;
          SQL
          done

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_MIGRATE_USERNAME=.*/DB_MIGRATE_USERNAME=postgres/' .env

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
